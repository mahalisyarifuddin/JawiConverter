name: Fetch Utusan Parquet encrypted

on:
  push:
    paths:
      - .github/workflows/fetch-utusan.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify, and envelope-encrypt splits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output
          cat <<'PEM' > output/pub.pem
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvm/QVsJSBPtm1vlo0zFn
          tA/lQH4bAewh33wIZP14l3ktnO59on6EpMwn/oU1jLuk78n8M941F9qGTazRL+EQ
          XVp+uHCgIfhPKGDvVlAtfiLcYT6HfUhVCkQBWOpu2EZpVyxreNbmcIBzWYs7s+ja
          ExH2rWOqnELQyWgiSX99/bWtwUPjk/2X011TdJ1GicfJUvGTQvy9kUMn16rzPPMT
          VYp0g+hdYNg4mTHXpdY5KG7kewMxAax54HcvDo7Btlp6UtMyVGuWT/KbT9dMTxs7
          1oMV6GfDsRK0AJiDXFFUGfPfWibOTSNRVXJvr6MSftz79TnNtIeflkRp5O5X3boz
          SwIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 -m pip install --quiet pyarrow
          base='https://huggingface.co/datasets/mahalisyarifuddin/utusan-jawi-sentences/resolve/main'
          for split in train validation test; do
            curl --fail --location --retry 5 --retry-all-errors               "$base/$split.parquet" --output "output/$split.parquet"
            key_hex=$(openssl rand -hex 32)
            openssl enc -aes-256-cbc -pbkdf2 -salt               -in "output/$split.parquet" -out "output/$split.parquet.enc" -pass "pass:$key_hex"
            printf '%s' "$key_hex" | openssl pkeyutl -encrypt -pubin -inkey output/pub.pem               -pkeyopt rsa_padding_mode:oaep -out "output/$split.key.enc"
            python3 - "$split" <<'PY'
          import base64, hashlib, json, sys
          import pyarrow.parquet as pq
          split = sys.argv[1]
          table = pq.read_table(f'output/{split}.parquet', columns=['text', 'latin_text'])
          raw = open(f'output/{split}.parquet', 'rb').read()
          sha256 = hashlib.sha256(raw).hexdigest()
          print(f'{split}: rows={table.num_rows} bytes={len(raw)} sha256={sha256}')
          inner = json.dumps({
              'split': split,
              'rows': table.num_rows,
              'sha256': sha256,
              'key_b64': base64.b64encode(open(f'output/{split}.key.enc', 'rb').read()).decode('ascii'),
              'data_b64': base64.b64encode(open(f'output/{split}.parquet.enc', 'rb').read()).decode('ascii'),
          })
          blob_req = {'content': inner, 'encoding': 'utf-8'}
          with open(f'output/{split}.blob.json', 'w') as f:
              json.dump(blob_req, f)
          PY
            sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs"               --input "output/$split.blob.json" --jq '.sha')
            echo "ENC_BLOB $split $sha"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"               -f state='success' -f context="utusan-parquet-$split" -f description="$sha" --silent
          done
