name: Fetch Utusan Parquet artifacts

on:
  push:
    paths:
      - .github/workflows/fetch-utusan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate the three official splits
        run: |
          set -euo pipefail
          mkdir -p output
          base='https://huggingface.co/datasets/mahalisyarifuddin/utusan-jawi-sentences/resolve/main'
          for split in train validation test; do
            curl --fail --location --retry 5 --retry-all-errors \
              "$base/$split.parquet" --output "output/$split.parquet"
          done
          python3 -m pip install --quiet pyarrow
          python3 - <<'PY'
          import pyarrow.parquet as pq
          expected = {'train': 15881, 'validation': 1989, 'test': 1972}
          for split, rows in expected.items():
              path = f'output/{split}.parquet'
              table = pq.read_table(path, columns=['text', 'latin_text'])
              assert table.num_rows == rows, (split, table.num_rows, rows)
              print(f'{split}: {table.num_rows} rows')
          PY
          sha256sum output/*.parquet | tee output/SHA256SUMS
      - name: Transport files as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for split in train validation test; do
            python3 - "$split" <<'PY'
          import base64, json, sys
          split = sys.argv[1]
          with open(f'output/{split}.parquet', 'rb') as source:
              payload = {'content': base64.b64encode(source.read()).decode('ascii'), 'encoding': 'base64'}
          with open(f'output/{split}.blob.json', 'w') as target:
              json.dump(payload, target)
          PY
            sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input "output/$split.blob.json" --jq '.sha')
            echo "PARQUET_BLOB $split $sha"
          done
