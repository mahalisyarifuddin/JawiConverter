<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JawiConverter</title>
    <style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — Salin Saja (Latin ↔ Jawi)
		   1200px for the Sumber | Terjemahan split. The mode switch is a
		   segmented control of two directions; Swap is a separate action beside
		   it. Jawi output renders RTL in a Naskh-style stack.
		   ===================================================================== */
		:root {
			--content-max: 1200px;
			--font-jawi: "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif;
		}

		.settings-card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-4) var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
		}
		.setting-row { display: flex; align-items: center; gap: var(--sp-6); flex-wrap: wrap; }
		.setting-group { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; min-width: 0; }
		.setting-group select { width: auto; max-width: 22rem; }
		.label { font-weight: 500; font-size: .875rem; margin-bottom: 0; min-width: 40px; }

				/* ---------- Conversion mode switch ---------- */
		.mode-row {
			display: flex;
			align-items: center;
			gap: var(--sp-3);
			flex-wrap: wrap;
			min-width: 0;
		}

		/* Segmented control: one choice of two directions */
		.mode-toggle {
			display: flex;
			align-items: stretch;
			background: var(--surface-variant);
			border: 1px solid var(--border);
			padding: 3px;
			border-radius: var(--radius-pill);
			gap: 2px;
			min-width: 0;
		}
		.mode-btn {
			padding: 0 var(--sp-4);
			min-height: 32px;
			border-radius: var(--radius-pill);
			font-size: .875rem;
			font-weight: 500;
			background: transparent;
			color: var(--text-muted);
			border: 0;
			white-space: nowrap;
		}
		.mode-btn:hover { background: var(--muted); color: var(--text); }
		.mode-btn[aria-pressed="true"] {
			background: var(--surface);
			color: var(--primary);
			box-shadow: var(--shadow-1);
		}

		/* Swap sits outside the segmented control — it is an action, not a mode */
		.swap-circle {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-pill);
			min-height: 34px;
			padding: 0 var(--sp-3);
			gap: var(--sp-2);
			color: var(--text);
			font-size: .8125rem;
			font-weight: 500;
			flex-shrink: 0;
		}
		.swap-circle:hover:not(:disabled) { background: var(--muted); border-color: var(--primary); color: var(--primary); }
		.swap-circle:disabled { opacity: .45; cursor: not-allowed; }
		.swap-circle svg { flex-shrink: 0; }

		/* Tablet: keep the two options on one row, sharing the width evenly */
		@media (max-width: 760px) {
			.mode-row { width: 100%; }
			.mode-toggle { width: 100%; }
			.mode-btn { flex: 1; min-width: 0; padding: 0 var(--sp-2); }
			.swap-circle { width: 100%; justify-content: center; }
		}

		/* Phone: stack the segmented control */
		@media (max-width: 560px) {
			.mode-toggle {
				flex-direction: column;
				border-radius: var(--radius);
				padding: 4px;
				gap: 3px;
			}
			.mode-btn {
				width: 100%;
				border-radius: var(--radius-sm);
				min-height: 38px;
			}
		}

		/* Sumber | Terjemahan — two equal panels, stacked below 900px */
		.main-layout {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: var(--sp-4);
		}
		@media (max-width: 900px) {
			.main-layout { grid-template-columns: 1fr; }
			.panel { min-height: 320px; }
		}

		.panel {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			display: flex;
			flex-direction: column;
			min-height: 420px;
			min-width: 0;
			overflow: hidden;
		}
		.panel-header {
			padding: var(--sp-3) var(--sp-4);
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-3);
			flex-wrap: wrap;
		}
		.panel-title {
			font-size: .75rem;
			font-weight: 700;
			color: var(--primary);
			text-transform: uppercase;
			letter-spacing: .06em;
		}
		.panel-body { flex: 1; padding: var(--sp-4); display: flex; flex-direction: column; min-width: 0; }
		.panel-footer {
			padding: var(--sp-2) var(--sp-4);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			gap: var(--sp-2);
			flex-wrap: wrap;
			align-items: center;
		}
		.stats-bar {
			padding: var(--sp-2) var(--sp-4);
			font-size: .75rem;
			color: var(--text-muted);
			display: flex;
			justify-content: space-between;
			gap: var(--sp-3);
			border-top: 1px solid var(--border);
			background: var(--surface-variant);
		}

		textarea {
			width: 100%;
			flex: 1;
			border: none;
			resize: none;
			font-size: 1.25rem;
			line-height: 1.6;
			background: transparent;
			padding: 0;
			min-height: 8rem;
		}
		textarea:hover { border: none; }
		textarea:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--primary); border-radius: var(--radius-sm); }
		textarea.jawi-input {
			direction: rtl;
			text-align: right;
			font-family: var(--font-jawi);
			font-size: 1.75rem;
			line-height: 1.9;
		}

		.output-display {
			font-size: 1.25rem;
			word-break: break-word;
			white-space: pre-wrap;
			flex: 1;
			overflow-y: auto;
			min-height: 8rem;
		}
		.jawi-display {
			direction: rtl;
			text-align: right;
			font-family: var(--font-jawi);
			font-size: 1.75rem;
			line-height: 1.9;
		}
		.rumi-display { font-size: 1.125rem; line-height: 1.7; }

		/* Compact button variant used inside panels */
		button.btn {
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--border);
			font-size: .8125rem;
			min-height: 32px;
			padding: 0 var(--sp-3);
			border-radius: var(--radius);
		}
		button.btn:hover { background: var(--muted); }

		.icon-btn {
			background: transparent;
			border: none;
			padding: var(--sp-1);
			border-radius: 50%;
			color: var(--text-muted);
			min-height: 0;
		}
		.icon-btn:hover { background: var(--muted); }

		/* Example chips under the source textarea */
		.chips {
			display: flex;
			gap: var(--sp-2);
			flex-wrap: wrap;
			margin-top: var(--sp-3);
			align-items: center;
		}
		.chip {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			color: var(--text-muted);
			border-radius: var(--radius-pill);
			font-size: .75rem;
			font-weight: 500;
			min-height: 26px;
			padding: 0 var(--sp-3);
			cursor: pointer;
		}
		.chip:hover { background: var(--muted); color: var(--primary); border-color: var(--primary); }

		/* Test table: Jawi columns render in the Jawi stack */
		td.jawi-cell { font-family: var(--font-jawi); font-size: 1.25rem; direction: rtl; }

		/* Help / shortcut disclosures */
		/* shortcut rows lead with a key chip, so bullets are redundant */
		#shortcutList { list-style: none; padding-left: 0; }
		.disclosure-body kbd {
			display: inline-block;
			min-width: 4.5em;
			text-align: center;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: 1px 6px;
			font-family: var(--font-mono);
			font-size: .8125rem;
			color: var(--text);
		}
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-title-group">
			<h1 id="title">JawiConverter</h1>
			<p id="subtitle" class="app-subtitle">Penukaran teks Melayu mengikut Pedoman Umum Ejaan Jawi Bahasa Melayu (DBP).</p>
		</div>
		<div class="app-controls">
			<button id="settingsBtn" class="btn-icon" type="button" aria-label="Settings" title="Settings">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<circle cx="12" cy="12" r="3"></circle>
					<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
				</svg>
			</button>
		</div>
	</header>

	<main class="app-main">
		<div class="settings-card">
			<div class="setting-row">
				<div class="setting-group mode-row">
					<span class="label" id="dirLabel">Arah</span>
					<div class="mode-toggle" role="group" aria-labelledby="dirLabel">
						<button class="mode-btn" id="btnLJ" type="button" aria-pressed="true" onclick="app.setMode('lj')">
							<span id="dirLJ">Rumi → Jawi</span>
						</button>
						<button class="mode-btn" id="btnJL" type="button" aria-pressed="false" onclick="app.setMode('jl')">
							<span id="dirJL">Jawi → Rumi</span>
						</button>
					</div>
					<button class="swap-circle" id="swapBtn" type="button" onclick="app.swap()">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
						<span id="swapBtnText">Tukar</span>
					</button>
				</div>

			</div>
		</div>

		<div class="main-layout">
			<section class="panel">
				<div class="panel-header">
					<span class="panel-title" id="inputPanelTitle">Sumber</span>
					<span class="hint nums" id="topCount">0 aksara</span>
				</div>
				<div class="panel-body">
					<textarea id="inputArea" placeholder="Taip teks Rumi di sini…"></textarea>
					<div id="inputCaption" class="hint">Taip teks Rumi. Penukaran berlaku secara langsung.</div>
				</div>
				<div class="panel-footer">
					<button id="convertBtn" type="button">Tukar</button>
					<button class="btn" id="clearBtn">Kosongkan</button>
					<button class="btn" id="pasteBtn">Tampal</button>
					<button class="btn" id="uploadBtn">Muat naik .txt</button>
					<input type="file" id="fileInput" accept=".txt,text/plain" class="hidden">
					<label class="check" style="margin-left:auto"><input type="checkbox" id="chkLive" checked> <span id="liveLabel">Langsung</span></label>
				</div>
				<div class="stats-bar">
					<span id="sourceCharCount">Aksara: 0</span>
					<span id="sourceWordCount">Perkataan: 0</span>
				</div>
			</section>

			<section class="panel">
				<div class="panel-header">
					<span class="panel-title" id="outputPanelTitle">Terjemahan</span>
					<label class="check"><span id="autoScrollLabel">Auto-scroll</span> <input type="checkbox" id="autoScroll" checked></label>
				</div>
				<div class="panel-body">
					<div id="jawiOut" class="output-display jawi-display" aria-live="polite"></div>
					<div id="latinOut" class="output-display rumi-display hidden" aria-live="polite"></div>
					<div id="outputCaption" class="hint"></div>
				</div>
				<div class="panel-footer">
					<button class="btn" id="copyBtn">Salin semua</button>
					<span class="hint" id="syllInfo"></span>
				</div>
				<div class="stats-bar">
					<span id="outputCharCount">Aksara: 0</span>
					<span id="outputInfo"></span>
				</div>
			</section>
		</div>

		<details class="disclosure">
			<summary id="helpLabel">Bantuan</summary>
			<div class="disclosure-body" id="helpBody"></div>
		</details>

		<details class="disclosure">
			<summary id="kbdShortcuts">Pintasan papan kekunci</summary>
			<div class="disclosure-body">
				<ul id="shortcutList"></ul>
			</div>
		</details>
	</main>

	<dialog id="settingsDialog" class="sheet" aria-labelledby="prefTitle">
		<form method="dialog">
			<div class="sheet-header">
				<h2 id="prefTitle"></h2>
				<button class="btn-icon" value="close" aria-label="Close settings">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
						<path d="M18 6 6 18M6 6l12 12"></path>
					</svg>
				</button>
			</div>
			<div class="sheet-body">
				<div class="field">
					<label id="langLabel" for="language"></label>
					<select id="language"><option value="ms">Bahasa Melayu</option><option value="en">English</option></select>
				</div>
				<div class="field">
					<label id="themeLabel" for="theme"></label>
					<select id="theme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select>
				</div>
			</div>
			<div class="sheet-footer">
				<button value="close" id="settingsDoneBtn"></button>
			</div>
		</form>
	</dialog>

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				ms: { prefTitle: 'Tetapan', prefBtn: 'Tetapan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Automatik', themeLight: 'Terang', themeDark: 'Gelap' },
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' }
			};

			const AppSettings = {
				/* The app's table, shaped { ms: ..., en: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('ms-MY' -> 'ms'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

    if (ONSETS_DIGRAPH.includes(two)) { units.push(two); i+=2; }
    else { units.push(cluster[i]); i+=1; }
  }
  return units;
}

// Syllabify v2 — segmentasi berasaskan posisi vokal + kluster (unit-aware digraph)
function syllabify(word) {
  word = normalizeE(word.toLowerCase());
  if (!word) return [];
  let nuclei = [];
  let i = 0;
  while (i < word.length) {
    let two = word.substr(i,2);
    if (["ai","au","oi","ae"].includes(two)) {
      nuclei.push({start:i, len:2, vowel:two});
      i+=2;
    } else if (isVowel(word[i])) {
      nuclei.push({start:i, len:1, vowel:word[i]});
      i+=1;
    } else {
      i+=1;
    }
  }
  if (nuclei.length === 0) {
    return [{text:word, onset:word, vowel:"", coda:"", isOpen:false, isFirst:true, isLast:true}];
  }
  if (nuclei.length === 1) {
    let n = nuclei[0];
    let onset = word.substring(0, n.start);
    let coda = word.substring(n.start + n.len);
    let isOpen = (coda === "");
    return [{text: onset+n.vowel+coda, onset, vowel:n.vowel, coda, isOpen, isFirst:true, isLast:true}];
  }
  // >=2 nukleus: bahagi antara nukleus menggunakan unit
  let boundaries = [];
  for (let k=0;k<nuclei.length-1;k++) {
    let cur = nuclei[k];
    let nxt = nuclei[k+1];
    let cluster = word.substring(cur.start+cur.len, nxt.start);
    if (cluster === "") {
      boundaries.push(cur.start+cur.len);
      continue;
    }
    let units = clusterToUnits(cluster);
    if (units.length === 1) {
      // V C V -> C onset next
      boundaries.push(cur.start+cur.len);
    } else if (units.length === 2) {
      let combined = units.join('');
      // jika CC valid cluster atau digraf -> keduanya onset
      if (VALID_CLUSTERS.has(combined) || ONSETS_DIGRAPH.includes(combined) || VALID_CLUSTERS.has(units.join(''))) {
        boundaries.push(cur.start+cur.len);
      } else {
        // C|C -> first coda
        let firstUnitLen = units[0].length;
        boundaries.push(cur.start+cur.len+firstUnitLen);
      }
    } else if (units.length >= 3) {
      // V CCC V -> first unit coda, rest onset (e.g., m|bl)
      // Khusus ng cluster: ng|k -> sudah 2 unit tapi di sini 3? actually m b l = 3 units
      let firstLen = units[0].length;
      boundaries.push(cur.start+cur.len+firstLen);
    }
  }
  let syllables = [];
  let prev = 0;
  for (let k=0;k<nuclei.length;k++) {
    let n = nuclei[k];
    let start = prev;
    let end = (k < nuclei.length-1) ? boundaries[k] : word.length;
    let sylText = word.substring(start, end);
    let onset = word.substring(start, n.start);
    let vowel = n.vowel;
    let coda = word.substring(n.start+vowel.length, end);
    let isOpen = (coda === "");
    syllables.push({text:sylText, onset, vowel, coda, isOpen, isFirst:(k===0), isLast:false});
    prev = end;
  }
  if (syllables.length) syllables[syllables.length-1].isLast = true;
  if (syllables.length>1) syllables[syllables.length-2].isPenult = true;
  let cleaned = [];
  for (let s of syllables) {
    if (s.vowel === "" && cleaned.length) {
      cleaned[cleaned.length-1].coda += s.onset + s.coda;
      cleaned[cleaned.length-1].text += s.text;
    } else cleaned.push(s);
  }
  cleaned.forEach((s, idx)=>{ s.isFirst = idx===0; s.isLast = idx===cleaned.length-1; s.isOpen = s.coda===""});
  return cleaned;
}

// ---------- 4. Pepet vs Taling ----------
function isTaling(globalWord, syl) {
  if (syl.vowel === 'é') return true;
  if (syl.vowel !== 'e') return false;
  if (PEDOMAN_TALING_WORDS.has(globalWord) ||
      PEDOMAN_TALING_WORDS.has(`${globalWord}:${syl.text}`) || TALING_DICT.has(globalWord)) return true;
  if (TALING_DICT.has(syl.text)) return true;
  // Rumi does not distinguish taling from pepet.  These conservative shape
  // rules cover productive European loans while lexical pronunciation above
  // resolves the native minimal pairs required by Pedoman 4.4/8.9/8.12.
  if (syl.isLast && ['k','g','j','h','t','s','ng','l','y'].includes(syl.coda)) return true;
  if (syl.coda === 'n' && ['b','s','p'].includes(syl.onset)) return true;
  if (syl.isOpen && syl.isLast) {
    try { if (syllabify(globalWord).length >= 2) return true; } catch (error) {}
  }
  return false;
}

// ---------- 5. Aturan Alif untuk 'a' (merangkum §8.2—9.3 pedoman) ----------
function needAlifForA(syllables, idx, globalWord) {
  const syl = syllables[idx];
  if (syl.vowel !== 'a') return null;
  const isOpen = syl.isOpen;
  const n = syllables.length;
  // Pedoman 7.2: closed monosyllables omit alif, except words beginning
  // with wau and the specifically stated word dan.
  if (!isOpen) {
    if (n === 1) return syl.onset.startsWith('w') || globalWord === 'dan';
    if (idx === n - 2 && PEDOMAN_CLOSED_A_ALIF_WORDS.has(globalWord)) return true;
    return false;
  }
  if (n === 1) return true;
  const lastOnset = syllables[n-1].onset;
  const lastIsKafGa = (lastOnset === 'k' || lastOnset === 'g');
  const lastIsDalRa = ['d','r','l','w','ng'].includes(lastOnset);
  if (n === 2) {
    const s0 = syllables[0], s1 = syllables[1];
    const bothOpen = s0.isOpen && s1.isOpen;
    const closedOpen = !s0.isOpen && s1.isOpen;
    const openClosed = s0.isOpen && !s1.isOpen;
    const bothClosed = !s0.isOpen && !s1.isOpen;
    if (bothOpen) {
      if (s0.vowel === 'e' && !isTaling(globalWord, s0)) return true;
      if (PEDOMAN_FINAL_KA_ALIF_WORDS.has(globalWord)) return true;
      if (lastIsKafGa) return idx === 0;
      // Rules 8.2 and 8.5: the Dal-Ra-Lam-Wau-Nga test is specific to
      // a+a. With any other written penultimate vowel, final /a/ takes alif.
      if (s0.vowel !== 'a') return true;
      if (lastIsDalRa) return true;
      return idx === 0;
    }
    if (closedOpen) {
      if (s0.vowel === 'e' && !isTaling(globalWord, s0)) return true;
      if (lastIsKafGa) return false;
      return idx === 1;
    }
    if (openClosed) {
      if (idx === 1) return false;
      if (s0.vowel === 'e' && !isTaling(globalWord, s0)) return false;
      return true;
    }
    if (bothClosed) return false;
  }
  if (n >= 3) {
    // Pedoman 9.3 omits first-syllable open /a/ in native words.  Its listed
    // acronym/compound/European-loan classes retain alif.
    if (idx === 0) return PEDOMAN_FIRST_A_ALIF_WORDS.has(globalWord);
    if (idx < n-2) return PEDOMAN_FIRST_A_ALIF_WORDS.has(globalWord);
    const penult = syllables[n-2];
    const last = syllables[n-1];
    const bothOpenLast = penult.isOpen && last.isOpen;
    const closedOpenLast = !penult.isOpen && last.isOpen;
    const openClosedLast = penult.isOpen && !last.isOpen;
    const bothClosedLast = !penult.isOpen && !last.isOpen;
    const praPepetLast = penult.vowel === 'e' && !isTaling(globalWord, penult);
    if (bothOpenLast) {
      if (praPepetLast) return true;
      if (PEDOMAN_FINAL_KA_ALIF_WORDS.has(globalWord)) return true;
      if (lastIsKafGa) return idx === n-2;
      if (penult.vowel !== 'a') return true;
      if (lastIsDalRa) return true;
      return idx === n-2;
    }
    if (closedOpenLast) {
      if (praPepetLast) return true;
      if (lastIsKafGa) return false;
      return idx === n-1;
    }
    if (openClosedLast) {
      if (idx === n-1) return false;
      if (praPepetLast) return false;
      return true;
    }
    if (bothClosedLast) return false;
  }
  return true;
}

// ---------- 6. Konsonan ke Jawi ----------
function consonantToJawiCons(str) {
  if (!str) return "";
  // str boleh "ng", "ny", "bl" cluster etc
  // Jika digraf known, map directly
  if (JAWI[str]) return JAWI[str];
  // Jika cluster 2 huruf seperti "bl": map per huruf
  let out = "";
  let i=0;
  while (i<str.length) {
    let two = str.substr(i,2);
    if (JAWI[two]) { out += JAWI[two]; i+=2; }
    else { out += JAWI[str[i]] || str[i]; i+=1; }
  }
  return out;
}

// ---------- 7. Utama: Rumi -> Jawi per suku ----------
function syllableToJawi(syl, idx, allSyls, globalWord) {
  let vowel = syl.vowel;
  // Kosong (should not happen)
  if (!vowel) {
    return consonantToJawiCons(syl.onset) + consonantToJawiCons(syl.coda);
  }

  // HAMZAH 0 — KVVK hamzah dimatikan (semua hamzah via EXC)

  // Onset Jawi
  let onsetJ = consonantToJawiCons(syl.onset);
  let hasOnset = syl.onset !== "";

  // Vokal Jawi
  let vowelJ = "";
  const isFirstSyll = idx===0;
  // Perhatikan: vokal awal yang tanpa onset perlu alif. Jika ada onset, vokal medial tidak perlu alif awal.
  // Jadi cek hasOnset, bukan isFirstSyll semata.

  if (vowel === "a") {
    let needAlif = needAlifForA(allSyls, idx, globalWord);
    // Jika tidak ada onset dan vokal a, tetap perlu alif (ada → ادا)
    if (!hasOnset && idx>0 && allSyls[idx-1].vowel==="a") {
      vowelJ = "ء"; // v10: a + a tanpa onset → hamzah (binaan→بيناءن, kenyataan→کڽاتاءن, bacaan→باچاءن)
    } else if (!hasOnset) {
      vowelJ = "ا"; // a awal tanpa onset selalu alif
      // Jika needAlif false untuk KVK? tapi a awal tanpa onset & terbuka? tetap alif
    } else if (needAlif) {
      vowelJ = "ا";
    } else {
      vowelJ = "";
    }
  } else if (vowel === "i") {
    if (!hasOnset && idx > 0 && allSyls[idx - 1].vowel === 'u') {
      vowelJ = "ءي"; // Pedoman 3.9: ui in KVVK, e.g. buih/keruing
    } else if (!hasOnset && idx === 0) vowelJ = "اي"; // i awal kata: alif-ya
    else vowelJ = "ي"; // medial i, including an onset-free vowel sequence
  } else if (vowel === "é") {
    if (!hasOnset && idx === 0) vowelJ = "اي";
    else vowelJ = "ي";
  } else if (vowel === "e") {
    let taling = isTaling(globalWord, syl);
    if (taling) {
      if (!hasOnset && idx === 0) vowelJ = "اي";
      else vowelJ = "ي";
    } else {
      // pepet
      if (!hasOnset && idx === 0) vowelJ = "ا"; // pepet awal kata → alif (emas → امس)
      else if (syl.isLast && syl.isOpen) vowelJ = "ى"; // akhir terbuka pepet → ى (metode)
      else vowelJ = ""; // medial pepet tidak ditulis
    }
  } else if (vowel === "o") {
    if (!hasOnset && idx === 0) vowelJ = "او";
    else vowelJ = "و";
  } else if (vowel === "u") {
    if (!hasOnset && idx === 0) vowelJ = "او";
    else vowelJ = "و";
  } else if (vowel === "ai" || vowel === "ae") {
    // HAMZAH v10 (data PRPM): diftong TERTUTUP → اءي (baik→باءيق); terbuka → اي (sampai→سمڤاي); ai tanpa onset → اءي
    vowelJ = (!syl.isOpen || !hasOnset) ? "اءي" : "اي";
  } else if (vowel === "au") {
    vowelJ = (!syl.isOpen || !hasOnset) ? "اءو" : "او";
  } else if (vowel === "oi") {
    // Pedoman 5.3: initial alif-wau-wau-ya; medial/final wau-ya.
    vowelJ = !hasOnset ? "اووي" : "وي";
  }

  let out;
  if (vowel === "a" && vowelJ === "") {
    out = onsetJ; // hanya konsonan onset, tanpa alif
  } else if (!hasOnset) {
    // tanpa onset, vokal sudah termasuk alif jika perlu
    out = vowelJ;
  } else {
    out = onsetJ + vowelJ;
  }

  // Coda
  if (syl.coda) {
    let coda = syl.coda;
    // final k → qaf jika tertutup dan di akhir kata (Melayu jati)
    // tapi jika sukukatanya bukan akhir? mis "makna" m a k n a: k adalah coda suku pertama? "mak" tertutup tapi bukan akhir kata → tetap ك ? pedoman: k tengah = ك , k akhir tertutup = ق
    let isLastSyll = idx === allSyls.length-1;
    // cluster coda seperti "ng" already handled via consonantToJawiCons
    // Need to handle single k vs q
    if (coda === "k" && isLastSyll) {
      const lowQaf = globalWord.toLowerCase();
      // Do not infer kaf from a loose -ek/-ik + j/v regex: it misclassified
      // native words such as mengejek. Keep the lexically verified set explicit.
      out += KAF_FINAL_WORDS.has(lowQaf) ? "ک" : "ق";
    } else {
      out += consonantToJawiCons(coda);
    }
  }
  return out;
}

function baseWordToJawi(word) {
  const lower = normalizeE(word.toLowerCase());
  if (PEDOMAN_ARABIC_HAMZAH[lower]) return PEDOMAN_ARABIC_HAMZAH[lower];
  if (PEDOMAN_WORD_ACRONYMS[lower]) return PEDOMAN_WORD_ACRONYMS[lower];
  if (PEDOMAN_SOLID_COMPOUNDS[lower]) return PEDOMAN_SOLID_COMPOUNDS[lower];
  if (PEDOMAN_COMPOUND_ROOTS[lower]) return PEDOMAN_COMPOUND_ROOTS[lower];
  if (PEDOMAN_ALIF_MAQSURAH[lower]) return PEDOMAN_ALIF_MAQSURAH[lower];
  if (EXCEPTION_DICT[lower]) return EXCEPTION_DICT[lower];
  if (EXCEPTION_DICT[word]) return EXCEPTION_DICT[word];
  const syllables = syllabify(lower);
  let jawi = "";
  for (let i = 0; i < syllables.length; i++) {
    jawi += syllableToJawi(syllables[i], i, syllables, lower);
  }
  return jawi;
}

function rootKind(surface, prefix = "") {
  if (surface.length < 3) return null;
  // meN-/peN- delete k, p, s, or t unless that consonant starts a cluster
  // (Pedoman 13.3-13.4). Restore it only to validate the lexical root; the
  // deleted consonant is not emitted in the derived spelling.
  const restored = {
    mem: "p", pem: "p", men: "t", pen: "t",
    meng: "k", peng: "k", meny: "s", peny: "s"
  }[prefix];
  if (restored && (BASE_SET.has(restored + surface) || MORPH_ROOTS.has(restored + surface))) return "restored";
  if (BASE_SET.has(surface) || MORPH_ROOTS.has(surface)) return "raw";
  return null;
}
function rootExists(surface, prefix = "") { return rootKind(surface, prefix) !== null; }

function adjustBaseForPrefix(baseJawi, baseLatin, prefix) {
  let output = baseJawi;
  // After meN-/peN-, initial i/e/o/u drops only its carrier alif while ya/wau
  // remains (menulis -> منوليس). Exposed or root-initial /a/ keeps alif
  // (menarik, mengajar); lexicalized suppressions are optimized later.
  if (NASAL_PREFIXES.has(prefix) && /^[ieéou]/u.test(baseLatin) && /^ا/u.test(output)) {
    output = output.slice(1);
  }
  if (["di", "ke", "se"].includes(prefix) && /^ا/u.test(output)) {
    output = "أ" + output.slice(1);
  }
  // Pedoman 3.13: after a borrowed prefix, initial alif for i/e/o/u is
  // replaced by hamzah; initial /a/ keeps alif.
  if (BORROWED_PREFIXES.has(prefix) && /^[ieéou]/u.test(baseLatin) && /^ا/u.test(output)) {
    const prefixJawi = PREFIX_RULES[prefix];
    const joinsForward = !/[ادذرزوؤء]$/u.test(prefixJawi);
    const vowelCarrier = /^[ieé]/u.test(baseLatin) ? "ي" : "و";
    let remainder = output.slice(1);
    if (!remainder.startsWith(vowelCarrier)) remainder = vowelCarrier + remainder;
    output = (joinsForward ? "ئ" : "ء") + remainder;
  }
  return output;
}

function appendSuffix(baseLatin, baseJawi, suffix) {
  const syllables = syllabify(baseLatin);
  const last = syllables[syllables.length - 1];
  if (!last) return baseJawi;
  // Pedoman 11.6: alif maqsurah changes to ordinary alif before an ending.
  if (baseJawi.endsWith("ى")) baseJawi = baseJawi.slice(0, -1) + "ا";

  if (suffix === "an") {
    if (last.isOpen && (last.vowel === "u" || last.vowel === "au")) return baseJawi + "ان";
    if (last.vowel === "a" && last.isOpen) {
      if (!baseJawi.endsWith("ا")) baseJawi += "ا";
      return baseJawi + "ءن";
    }
    return baseJawi + "ن";
  }
  if (suffix === "kan") {
    if (last.vowel === "a" && last.isOpen && !baseJawi.endsWith("ا")) baseJawi += "ا";
    return baseJawi + "کن";
  }
  if (suffix === "i") {
    if (last.vowel === "a" && last.isOpen && !baseJawi.endsWith("ا")) baseJawi += "ا";
    if ((last.isOpen && ["a", "o", "u", "au"].includes(last.vowel)) || /[او]$/u.test(baseJawi)) {

    }
    return baseJawi + "ي";
  }
  return baseJawi + (FIXED_SUFFIX_JAWI[suffix] || baseWordToJawi(suffix));

function wordToJawiMorpheme(word) {
  const lower = normalizeE(word.toLowerCase());
  let best = null;
  let bestScore = -1;
  const prefixes = Object.keys(PREFIX_RULES).sort((a, b) => b.length - a.length);

  function consider(prefix, base, suffix = "") {
    // Avoid treating ordinary lexical endings (makan, rakan, bahan, serai)
    // as productive suffixes. Three-letter stems remain valid with an overt
    // prefix, where the morphological boundary is independently signalled.
    if (suffix && !prefix && base.length < 4 && !["ku", "mu", "nya", "lah", "kah", "tah", "pun"].includes(suffix)) return;
    if (!rootExists(base, prefix)) return;
    let baseJawi = baseWordToJawi(base);
    baseJawi = adjustBaseForPrefix(baseJawi, base, prefix);
    if (suffix) baseJawi = appendSuffix(base, baseJawi, suffix);
    const candidate = (prefix ? PREFIX_RULES[prefix] : "") + baseJawi;
    // A longer overt prefix is stronger evidence than a coincidental longer
    // stem beginning inside that prefix (mengarang is meng+arang, not men+garang).
    const score = prefix.length * 100 + base.length * 10 + suffix.length;
    if (score > bestScore) {
      best = candidate;
      bestScore = score;
    }
  }

  for (const prefix of prefixes) {
    if (!lower.startsWith(prefix)) continue;
    const remainder = lower.slice(prefix.length);
    if (rootExists(remainder, prefix)) consider(prefix, remainder);
    for (const suffix of SUFFIXES_MORPH) {
      if (!remainder.endsWith(suffix)) continue;
      const base = remainder.slice(0, -suffix.length);
      consider(prefix, base, suffix);
    }
  }
  for (const suffix of SUFFIXES_MORPH) {
    if (!lower.endsWith(suffix)) continue;
    const base = lower.slice(0, -suffix.length);
    consider("", base, suffix);
  }
  return best;
}
function wordToJawi(word) {
  if (!word) return "";
  let low=word.toLowerCase();
  if(EXCEPTION_DICT[low]) return EXCEPTION_DICT[low];
  if(EXCEPTION_DICT[word]) return EXCEPTION_DICT[word];
  // Lexical classes explicitly enumerated by the Pedoman must reach their
  // spelling rule before a coincidental ending is interpreted as an affix.

      PEDOMAN_FINAL_KA_ALIF_WORDS.has(low) || PEDOMAN_ALIF_MAQSURAH[low] ||

  }

function normalizeJawiInput(jawi) {
  return String(jawi).normalize('NFC').replace(/[\u0080-\u009F\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, '');
}

// Build REVERSE_DICT from normalized EXCEPTION_DICT forms (Jawi -> Latin, first wins).
const REVERSE_DICT = {};
for (let [lat, rawJawi] of Object.entries(EXCEPTION_DICT)) {
  const jawi = normalizeJawiInput(rawJawi);
  if (!REVERSE_DICT[jawi]) REVERSE_DICT[jawi] = lat;
}
const REVERSE_PHRASE_ENTRIES = Object.entries(REVERSE_DICT)
  .filter(([jawi]) => /\s/.test(jawi))
  .sort((a, b) => b[0].length - a[0].length);

function escapeRegExp(value) {
  return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function replaceReversePhrases(text) {
  for (const [jawi, latin] of REVERSE_PHRASE_ENTRIES) {
    const pattern = jawi.split(/\s+/).map(escapeRegExp).join("\\s+");
    // Use Unicode-aware lookarounds so multi-word phrases match even when
    // surrounded by non-ASCII punctuation (e.g. ellipsis, Arabic comma).
    const regex = new RegExp("(?<![\\p{L}\\p{M}\\p{N}])" + pattern + "(?![\\p{L}\\p{M}\\p{N}])", "gu");
    text = text.replace(regex, latin);
  }
  return text;
}

// - Insert 'e' between two consonants without vowel letter (pepet) and 'a' before final ه etc when needed
const REVERSE_MAP = {
  'ا': 'a', 'أ': 'a', 'إ': 'i', 'آ': 'a', 'ؤ': 'u', 'ئ': 'i',
  'ب': 'b', 'ت': 't', 'ة': 't', 'ث': 's', 'ج': 'j', 'چ': 'c', 'ح': 'h', 'خ': 'kh',
  'د': 'd', 'ذ': 'z', 'ر': 'r', 'ز': 'z', 'س': 's', 'ش': 'sy',
  'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': '', 'غ': 'gh',
  'ڠ': 'ng', 'ݞ': 'ng', 'ف': 'f', 'ڤ': 'p', 'ق': 'k', 'ک': 'k', 'ك': 'k',
  'ڬ': 'g', 'ݢ': 'g', 'گ': 'g', 'ل': 'l', 'م': 'm', 'ن': 'n', 'و': 'w',
  'ۏ': 'v', 'ه': 'h', 'ء': "'", 'ي': 'y', 'ى': 'e', 'ڽ': 'ny', 'ڨ': 'q'
};

function heurJawiToRumi(jawi) {
  const vowelSet = new Set(['ا','أ','إ','آ','ؤ','ئ','و','ي','ى']);
  let out = '';
  for (let i = 0; i < jawi.length; i++) {
    const ch = jawi[i];
    if (ch === 'ا' || ch === 'أ' || ch === 'آ') out += 'a';
    else if (ch === 'إ') out += 'i';
    else if (ch === 'ؤ') out += 'u';
    else if (ch === 'ئ') out += 'i';
    else if (ch === 'ى') out += 'e';
    else if (ch === 'و') out += (i === 0 ? 'w' : 'o');
    else if (ch === 'ي') out += (i === 0 ? 'y' : 'i');
    else if (Object.prototype.hasOwnProperty.call(REVERSE_MAP, ch)) {
      const mapped = REVERSE_MAP[ch];
      out += mapped;
      // Approximate an unwritten Malay pepet between adjacent consonants.
      // Empty mappings (notably ain) must not leak the Arabic character or
      // create a spurious schwa.
      const next = jawi[i + 1];
      if (mapped && next && !vowelSet.has(next) &&
          Object.prototype.hasOwnProperty.call(REVERSE_MAP, next) && REVERSE_MAP[next]) {
        out += (i + 1 === jawi.length - 1) ? 'a' : 'e';

// spelling when it maps to exactly one Latin word. Ambiguous Jawi forms fall
// through to the orthographic heuristic rather than guessing.
let REVERSE_BASE_INDEX = null;
function getReverseBaseIndex() {
  if (REVERSE_BASE_INDEX) return REVERSE_BASE_INDEX;
  const candidates = new Map();
  for (const latin of BASE_SET) {
    const jawi = normalizeJawiInput(wordToJawi(latin));
    if (!candidates.has(jawi)) candidates.set(jawi, latin);
    else candidates.set(jawi, null);
  }
  REVERSE_BASE_INDEX = new Map();
  for (const [jawi, latin] of candidates) {
    if (latin !== null) REVERSE_BASE_INDEX.set(jawi, latin);

function jawiToRumi(jawi) {
  if (!jawi) return "";
  jawi = normalizeJawiInput(jawi);
  if (!jawi) return "";

  // and finally a character-level transliteration for unseen/ambiguous words.
  if (REVERSE_DICT[jawi]) return REVERSE_DICT[jawi];
  if (JAWI_TO_LATIN_AUTO[jawi]) return JAWI_TO_LATIN_AUTO[jawi];
  const baseMatch = getReverseBaseIndex().get(jawi);
  if (baseMatch) return baseMatch;
  return heurJawiToRumi(jawi);

function convertInitialism(token) {

  const source = ENGLISH_INITIALISMS.has(letters.join(""))

function convertLatinToken(token) {

  if (token === "Ng") return "ءڠ";
  if (token === "Ong") return "ءوڠ";
  if (/^Ch['’]ng$/u.test(token)) return "چئڠ";

  if (/^(?:[A-Z]\.){2,}[A-Z]?\.?$/u.test(token)) return convertInitialism(token);

      (MALAY_INITIALISMS.has(token) || ENGLISH_INITIALISMS.has(token))) return convertInitialism(token);

  if (exactException) return exactException;

    const parts = token.split(/([-\/])/g);
    const words = parts.filter(part => part && part !== '-' && part !== '/');

    if (parts.every(part => part !== '/') && words.length === 2 &&

      return wordToJawi(words[0]) + "٢";

      if (part === '-' || part === '/' || part === '') return part;

function latinToJawi(text) {

    const lower = token.toLowerCase();

    if ((lower === "di" || lower === "ke") && /^\s+$/u.test(tokens[i + 1] || "") &&

					'Copy the result from the Translation panel, or upload a .txt file.',
					'Special letters: type é to force taling (sate vs sé → ساتي). Plain e = pepet. Extra letters: ڬ ga, ڠ nga, ڽ nya, ڤ pa, چ ca, ۏ va.'
				],
				shortcutList: [
					['Ctrl ⌘ + Enter', 'Convert now'],
					['Alt + S', 'Swap direction'],
					['Alt + K', 'Clear input'],
					['Alt + C', 'Copy output']
				]
			}
		};

		const EXAMPLES = ['saya', 'makan', 'warna', 'sekolah', 'kampung', 'bahagia', 'bola', 'pais', 'boikot', 'gembleng'];

		const TESTS = [
			["dada", "دادا"], ["bara", "بارا"], ["pala", "ڤالا"], ["sawa", "ساوا"], ["nganga", "ڠاڠا"],
			["saya", "ساي"], ["rasa", "راس"], ["baja", "باج"], ["tanya", "تاڽ"], ["mata", "مات"],
			["baka", "باک"], ["saka", "ساک"], ["mika", "ميک"], ["luka", "لوک"], ["muka", "موک"],
			["teka", "تکا"], ["peta", "ڤتا"], ["beli", "بلي"], ["peri", "ڤري"],
			["tanda", "تندا"], ["warna", "ورنا"], ["kasta", "کستا"],
			["rangka", "رڠک"], ["harga", "هرڬ"], ["tangga", "تڠڬ"], ["bangga", "بڠڬ"],
			["bingka", "بيڠک"], ["serba", "سربا"], ["seksa", "سيکسا"], ["renda", "ريندا"],
			["belah", "بله"], ["harapan", "هراڤن"], ["bahagia", "بهڬيا"],
			["sekolah", "سکوله"], ["bintang", "بينتڠ"], ["kampung", "کمڤوڠ"], ["bola", "بولا"],
			["pais", "ڤاءيس"], ["aib", "اءيب"], ["boikot", "بوايکوت"], ["naik", "ناءيک"],
			["pulau", "ڤولاو"], ["serai", "سراي"], ["kerbau", "کرباو"],
			["ikan", "ايکن"], ["emas", "امس"], ["udang", "اودڠ"], ["oleh", "اوليه"]
		];

		const app = {
			lang: 'ms',
			mode: 'lj',
			liveTimer: null,

			init() {
				const $ = id => document.getElementById(id);
				AppSettings.strings = text;
				this.setLang(AppSettings.detectLang(['ms', 'en']));

				// example chips — optional (defensive)
				const row = $('chipRow');
				if (row) {
					EXAMPLES.forEach(w => {
						const b = document.createElement('button');
						b.type = 'button';
						b.className = 'chip';
						b.textContent = w;
						b.addEventListener('click', () => {
							const ia = $('inputArea');
							if (ia) ia.value = w;
							this.update();
						});
						row.appendChild(b);
					});
				}

				// actions — defensive binding
				const bind = (id, ev, fn) => {
					const el = $(id);
					if (el) el.addEventListener(ev, fn);
				};
				bind('convertBtn', 'click', () => this.update());
				bind('clearBtn', 'click', () => {
					const ia = $('inputArea');
					if (ia) ia.value = '';
					this.update();
				});
				bind('copyBtn', 'click', () => this.copyOut());
				bind('pasteBtn', 'click', async () => {
					try {
						const t = await navigator.clipboard.readText();
						const ia = $('inputArea');
						if (ia) ia.value = t;
						this.update();
					} catch (e) {}
				});
				bind('uploadBtn', 'click', () => {
					const fi = $('fileInput');
					if (fi) fi.click();
				});
				bind('fileInput', 'change', e => {
					const f = e.target.files && e.target.files[0];
					if (!f) return;
					const r = new FileReader();
					r.onload = () => {
						const ia = $('inputArea');
						if (ia) ia.value = String(r.result || '');
						this.update();
					};
					r.readAsText(f);
					e.target.value = '';
				});

				const inputArea = $('inputArea');
				if (inputArea) {
					inputArea.addEventListener('input', () => {
						const chkLive = $('chkLive');
						if (chkLive && !chkLive.checked) { this.updateCounts(); return; }
						clearTimeout(this.liveTimer);
						this.liveTimer = setTimeout(() => this.update(), 150);
					});
				}

				bind('runTestsBtn', 'click', () => this.runTests());

				// keyboard shortcuts
				document.addEventListener('keydown', e => {
					const mod = e.ctrlKey || e.metaKey;
					if (mod && e.key === 'Enter') { e.preventDefault(); this.update(); }
					else if (e.altKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); this.swap(); }
					else if (e.altKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); $('inputArea').value = ''; this.update(); }
					else if (e.altKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); this.copyOut(); }
				});

				// language select drives setLang (baseline AppSettings wiring also runs)
				$('language').addEventListener('change', e => this.setLang(e.target.value));

				this.update();
			},

			setMode(m) {
				this.mode = (m === 'jl') ? 'jl' : 'lj';
				const lj = this.mode === 'lj';
				const btnLJ = document.getElementById('btnLJ');
				const btnJL = document.getElementById('btnJL');
				if (btnLJ) btnLJ.setAttribute('aria-pressed', lj ? 'true' : 'false');
				if (btnJL) btnJL.setAttribute('aria-pressed', lj ? 'false' : 'true');
				const area = document.getElementById('inputArea');
				if (area) area.classList.toggle('jawi-input', !lj);
				const t = text[this.lang] || text.ms;
				if (btnLJ && t.dirLJTitle) btnLJ.title = t.dirLJTitle;
				if (btnJL && t.dirJLTitle) btnJL.title = t.dirJLTitle;
				const swapBtn = document.getElementById('swapBtn');
				if (swapBtn && t.swapTitle) swapBtn.title = t.swapTitle;
				this.update();
			},

			swap() {
				const $ = id => document.getElementById(id);
				const inputEl = $('inputArea');
				if (!inputEl) return;
				const cur = inputEl.value;
				if (this.mode === 'lj') {
					const jawiOut = $('jawiOut');
					inputEl.value = (jawiOut && jawiOut.textContent) ? jawiOut.textContent : cur;
					this.setMode('jl');
				} else {
					const latinOut = $('latinOut');
					inputEl.value = (latinOut && latinOut.textContent) ? latinOut.textContent : cur;
					this.setMode('lj');
				}
				inputEl.focus();
			},

			copyOut() {
				const jawiOut = document.getElementById('jawiOut');
				const latinOut = document.getElementById('latinOut');
				const out = this.mode === 'lj'
					? (jawiOut && jawiOut.textContent)
					: (latinOut && latinOut.textContent);
				if (!out) return;
				if (navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(out).catch(() => {});
				}
			},

			updateCounts() {
				const t = text[this.lang] || text.ms;
				const inputEl = document.getElementById('inputArea');
				const input = inputEl ? inputEl.value : '';
				const topCount = document.getElementById('topCount');
				const srcChar = document.getElementById('sourceCharCount');
				const srcWord = document.getElementById('sourceWordCount');
				if (topCount) topCount.textContent = input.length + (t.topCountUnit || '');
				if (srcChar) srcChar.textContent = (t.charCount || '') + input.length;
				if (srcWord) srcWord.textContent = (t.wordCount || '') + (input.trim() ? input.trim().split(/\s+/).length : 0);
			},

			update() {
				const $ = id => document.getElementById(id);
				const t = text[this.lang] || text.ms;
				const inputEl = $('inputArea');
				const input = inputEl ? inputEl.value : '';
				const jc = window.JawiConverter;
				let out = '';

				const inputCaption = $('inputCaption');
				const outputCaption = $('outputCaption');
				if (inputCaption) inputCaption.textContent = this.mode === 'lj' ? t.inputCaptionLJ : t.inputCaptionJL;
				if (outputCaption) outputCaption.textContent = this.mode === 'lj' ? '' : t.outputCaptionJL;

				if (jc) {
					try {
						out = this.mode === 'lj' ? jc.latinToJawi(input) : jc.jawiToLatin(input);
					} catch (e) { out = ''; console.error(e); }
				}

				const jawiOut = $('jawiOut');
				const latinOut = $('latinOut');
				if (this.mode === 'lj') {
					if (jawiOut) { jawiOut.textContent = out; jawiOut.classList.remove('hidden'); }
					if (latinOut) latinOut.classList.add('hidden');
				} else {
					if (latinOut) { latinOut.textContent = out; latinOut.classList.remove('hidden'); }
					if (jawiOut) jawiOut.classList.add('hidden');
				}

				// syllable info for first word (Rumi → Jawi only)
				const syllInfo = $('syllInfo');
				if (syllInfo) syllInfo.textContent = '';
				if (this.mode === 'lj' && jc && input.trim() && syllInfo) {
					try {
						const first = input.trim().split(/\s+/)[0].replace(/[^\wÀ-ÿ'-]/g, '');
						if (first) {
							const syl = jc.syllabify(first);
							syllInfo.textContent = first + ' → ' +
								syl.map(s => s.onset + '|' + s.vowel + '|' + s.coda + (s.isOpen ? '○' : '●')).join(' • ');
						}
					} catch (e) {}
				}

				this.updateCounts();
				const outChar = document.getElementById('outputCharCount');
				const outInfo = document.getElementById('outputInfo');
				if (outChar) outChar.textContent = (t.charCount || '') + (out || '').length;
				if (outInfo) outInfo.textContent = this.mode === 'lj' && syllInfo ? syllInfo.textContent : '';

				const autoScroll = $('autoScroll');
				if (autoScroll && autoScroll.checked) {
					document.querySelectorAll('.output-display:not(.hidden)').forEach(el => {
						el.scrollTop = el.scrollHeight;
					});
				}
			},

			runTests() {
				const jc = window.JawiConverter;
				if (!jc) return;
				const tbody = document.querySelector('#tblTests tbody');
				if (!tbody) return;
				tbody.innerHTML = '';
				let ok = 0;
				for (const [r, exp] of TESTS) {
					const got = jc.wordToJawi(r);
					let syl = '';
					try { syl = jc.syllabify(r).map(s => s.text).join('-'); } catch (e) {}
					const pass = got === exp;
					if (pass) ok++;
					const tr = document.createElement('tr');
					const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
					tr.innerHTML = '<td>' + esc(r) + '</td>' +
						'<td class="jawi-cell">' + esc(exp) + '</td>' +
						'<td class="jawi-cell">' + esc(got) + '</td>' +
						'<td><span class="badge ' + (pass ? 'badge-success' : 'badge-danger') + '">' + (pass ? '✓' : '✗') + '</span></td>' +
						'<td class="mono">' + esc(syl) + '</td>';
					tbody.appendChild(tr);
				}
				const sum = document.getElementById('testSummary');
				if (sum) {
					sum.textContent = ok + '/' + TESTS.length + ' (' + Math.round(ok / TESTS.length * 100) + '%)';
					sum.className = 'badge ' + (ok === TESTS.length ? 'badge-success' : (ok >= TESTS.length * 0.8 ? 'badge-warning' : 'badge-danger'));
				}
			},

			setLang(l) {
				this.lang = AppSettings.applyLang(l || 'ms');
				const t = text[this.lang] || text.ms;
				const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

				// id-keyed strings — defensive
				['title', 'subtitle', 'dirLabel', 'dirLJ', 'dirJL', 'swapBtnText', 'inputPanelTitle',
				 'outputPanelTitle', 'convertBtn', 'clearBtn', 'pasteBtn', 'uploadBtn', 'copyBtn',
				 'liveLabel', 'autoScrollLabel', 'examplesLabel', 'helpLabel', 'kbdShortcuts',
				 'testsLabel', 'runTestsBtn', 'colRumi', 'colExpect', 'colGot', 'colStatus', 'colSyl',
				 'settingsDoneBtn'].forEach(id => {
					const node = document.getElementById(id);
					if (node && t[id] != null) node.textContent = t[id];
				});
				const testNoteEl = document.getElementById('testNote');
				if (testNoteEl && t.testNote != null) testNoteEl.textContent = t.testNote;
				const dictNoteEl = document.getElementById('dictNote');
				if (dictNoteEl && t.dictNote != null) dictNoteEl.innerHTML = t.dictNote;

				// disclosure bodies (arrays)
				const helpBody = document.getElementById('helpBody');
				if (helpBody) {
					helpBody.innerHTML =
						'<ol>' + (t.helpSteps || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
						'<p>' + esc(t.outputCaptionJL || '') + '</p>';
				}
				const shortcutList = document.getElementById('shortcutList');
				if (shortcutList) {
					shortcutList.innerHTML = (t.shortcutList || [])
						.map(([k, v]) => '<li><kbd>' + esc(k) + '</kbd> — ' + esc(v) + '</li>').join('');
				}

				this.setMode(this.mode);
				const tblBody = document.querySelector('#tblTests tbody');
				if (tblBody && tblBody.children.length) this.runTests();
			},

			setTheme(t) { AppSettings.applyTheme(t); }
		};

		window.app = app;
		document.addEventListener('DOMContentLoaded', () => app.init());
	</script>
</body>
</html>
it());
